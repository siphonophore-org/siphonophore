name: Test

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - manifest.json
      - manifest-unstable.json
      - data/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test
        run: python3 -m unittest discover -s scripts -v

      - name: Check JSON
        run: |
          set -euo pipefail
          for file in plugins.json manifest.json manifest-unstable.json; do
            python3 -m json.tool "$file" > /dev/null
          done
          python3 - <<'EOF'
          import json, re
          plugins = json.load(open("plugins.json"))
          required = {"repo", "guid", "name", "overview", "description", "category", "imageUrl"}
          guids = set()
          for plugin in plugins:
              missing = required - plugin.keys()
              assert not missing, f"{plugin.get('name')} is missing {sorted(missing)}"
              assert re.fullmatch(r"[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}", plugin["guid"]), f"{plugin['name']} has a bad GUID"
              assert plugin["guid"] not in guids, f"{plugin['name']} repeats a GUID"
              guids.add(plugin["guid"])
          EOF
